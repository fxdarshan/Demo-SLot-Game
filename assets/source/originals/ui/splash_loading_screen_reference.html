<!-- Lightweight Falling Snow & Golden Stardust Particle Engine -->
<script>
    (function initHolidayAtmosphere() {
      const canvas = document.getElementById('snow-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      const particles = [];
      const particleCount = 60;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * -height;
          this.size = Math.random() * 2.8 + 0.8;
          this.speedY = Math.random() * 0.9 + 0.4;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.65 + 0.25;
          this.isGold = Math.random() > 0.55;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX + Math.sin(this.y * 0.008) * 0.25;
          if (this.y > height + 10) {
            this.reset();
            this.y = -10;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          if (this.isGold) {
            ctx.fillStyle = `rgba(255, 225, 109, ${this.opacity})`;
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#ffe16d';
          } else {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.shadowBlur = 3;
            ctx.shadowColor = '#ffffff';
          }
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      for (let i = 0; i < particleCount; i++) {
        const p = new Particle();
        p.y = Math.random() * height;
        particles.push(p);
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // Loading Bar Progress Simulation & Thematic Text Cycler
    (function handleGameLoadingSimulation() {
      const progressBar = document.getElementById('progress-bar-fill');
      const progressLabel = document.getElementById('progress-percentage-label');
      const statusText = document.getElementById('loading-status-text');

      const holidayStatusMessages = [
        "Loading Festive Wonders...",
        "Warming up the Reels...",
        "Polishing Golden Bells...",
        "Preparing Holiday Magic..."
      ];

      let msgIndex = 0;
      let progress = 68;

      setInterval(() => {
        msgIndex = (msgIndex + 1) % holidayStatusMessages.length;
        if (statusText) {
          statusText.classList.add('opacity-0');
          setTimeout(() => {
            statusText.innerText = holidayStatusMessages[msgIndex];
            statusText.classList.remove('opacity-0');
          }, 250);
        }
      }, 2800);

      const progressInterval = setInterval(() => {
        if (progress < 100) {
          progress += 1;
          if (progressBar) progressBar.style.width = progress + '%';
          if (progressLabel) progressLabel.innerText = progress + '%';
        } else {
          clearInterval(progressInterval);
          if (statusText) statusText.innerText = "Welcome to X-Mas Dolls!";
        }
      }, 150);

      // Audio Toggle
      const volBtn = document.getElementById('btn-volume');
      if (volBtn) {
        let isMuted = false;
        volBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          const icon = volBtn.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.innerText = isMuted ? 'volume_off' : 'volume_up';
            icon.setAttribute('data-icon', isMuted ? 'volume_off' : 'volume_up');
          }
        });
      }

      // Fullscreen Toggle
      const fullBtn = document.getElementById('btn-fullscreen');
      if (fullBtn) {
        fullBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
          }
        });
      }
    })();
  </script>
