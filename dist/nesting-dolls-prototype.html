<!DOCTYPE html>
<html lang="en">
<head>
<!-- Nesting Dolls prototype, single-file build 2026-11-13. Source: https://github.com/fxdarshan/Demo-SLot-Game -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nesting Dolls Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Lilita+One&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: game canvas fills the left, demo controls panel on the right (hide with D). */
  --bg: #121018; --panel: #1a1722; --raise: #24202e; --line: #34303f;
  --text: #ece8f4; --muted: #9a93ab; --accent: #c6a6ff; --accent-ink: #1c1030; --rec: #ff5468;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: 1fr 340px; }
.app.no-panel { grid-template-columns: 1fr; }
.app.no-panel .panel { display: none; }
.stage-wrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
canvas#stage { display: block; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.5); cursor: pointer; touch-action: manipulation; }
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel h1 { font-size: 15px; margin: 0; font-weight: 600; }
.scroll { overflow: auto; padding: 4px 16px 24px; }
section { padding: 6px 0 12px; border-bottom: 1px solid var(--line); }
section:last-child { border-bottom: 0; }
h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }
.info { font-size: 12.5px; color: var(--muted); margin: 6px 0; font-variant-numeric: tabular-nums; }
.info b { color: var(--text); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.grow { flex: 1; }
button { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: #4b4559; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.ghost { background: transparent; }
button.small { padding: 4px 9px; font-size: 12.5px; }
button.rec { color: #ffb6bf; border-color: #5a2a33; }
button.rec.on { background: var(--rec); border-color: var(--rec); color: #fff; }
select { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; counter-reset: q; }
.queue li { display: flex; align-items: center; gap: 8px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 4px 8px; counter-increment: q; font-size: 13px; }
.queue li::before { content: counter(q); font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 14px; }
.queue li .lbl { flex: 1; display: flex; align-items: center; gap: 8px; }
.queue li button { padding: 1px 7px; background: transparent; border-color: transparent; color: var(--muted); font-size: 12px; }
.queue li.empty { border-style: dashed; color: var(--muted); }
.queue li.empty::before { content: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.adds { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px; }
.adds button { display: flex; align-items: center; gap: 7px; font-size: 12.5px; text-align: left; padding: 6px 8px; }
.palette { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin-bottom: 6px; }
.palette button, .grid-ed button { padding: 1px; aspect-ratio: 1; border-radius: 6px; background: #120f18; display: flex; align-items: center; justify-content: center; }
.palette img, .grid-ed img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.palette button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.grid-ed { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 5px; background: #0e0c13; border: 1px solid var(--line); border-radius: 8px; }
.grid-ed button.wild-col { background: #1d1726; }
label.f { display: block; width: 100%; font-size: 13px; }
label.f select, label.f input[type=range] { width: 100%; margin-top: 4px; accent-color: var(--accent); }
label.f output { float: right; font-family: var(--f-mono); color: var(--accent); font-size: 12px; }
.mono { font-family: var(--f-mono); font-size: 12px; }
#recTime { color: var(--rec); }
#recOut video { width: 100%; border-radius: 8px; margin-top: 8px; background: #000; }
#recOut a { display: inline-block; margin-top: 8px; color: var(--accent); }
.small-list { margin: 6px 0 0; padding-left: 18px; color: var(--muted); max-height: 180px; overflow: auto; }
details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
.show-panel { position: fixed; right: 12px; top: 12px; opacity: .6; }
.show-panel:hover { opacity: 1; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  .stage-wrap { height: 60vh; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<div class="app" id="app">
  <main class="stage-wrap" id="wrap">
    <canvas id="stage" aria-label="Slot game"></canvas>
  </main>

  <aside class="panel" id="panel">
    <header>
      <h1>Demo controls</h1>
      <button id="hidePanel" class="ghost small" title="Hide panel (D)">Hide</button>
    </header>
    <div class="scroll">
      <section>
        <h2>Next spins</h2>
        <p class="hint">Spins play these outcomes in order (free spins too). An empty list spins at random.</p>
        <ol id="queue" class="queue"></ol>
        <div class="row">
          <button id="playQueue" class="primary">Play list</button>
          <button id="spin">Spin once</button>
          <span class="grow"></span>
          <button id="clearQueue" class="ghost small">Clear</button>
        </div>
        <div class="adds" id="adds"></div>
      </section>

      <section>
        <h2>Custom grid</h2>
        <p class="hint">Pick a symbol and click cells. The Wild Egg can only sit on reel 3.</p>
        <div id="palette" class="palette"></div>
        <div id="gridEd" class="grid-ed"></div>
        <div class="row">
          <label class="f">When the Wild lands
            <select id="edBear">
              <option value="">No star (plain Wild)</option>
              <option value="scare:1">Star → Scare Bear, small (1×)</option>
              <option value="scare:2">Star → Scare Bear, medium (2×)</option>
              <option value="scare:3">Star → Scare Bear, large (3×)</option>
              <option value="charm">Star → Charm Bear</option>
              <option value="dance">Star → Dance Bear (free spins)</option>
            </select>
          </label>
        </div>
        <p id="edInfo" class="info"></p>
        <div class="row"><button id="addCustom" class="small">Add to list</button><button id="copyBoard" class="ghost small">Copy current reels</button></div>
      </section>

      <section>
        <h2>Record video</h2>
        <div class="row">
          <select id="recMode" aria-label="Recording mode">
            <option value="spin">Next spin</option>
            <option value="queue">Whole list</option>
            <option value="manual">Manual start / stop</option>
          </select>
          <button id="rec" class="rec">● Record</button>
          <span id="recTime" class="mono"></span>
        </div>
        <div id="recOut"></div>
      </section>

      <section>
        <h2>Speed</h2>
        <label class="f">Presentation speed <output id="speedOut">1×</output>
          <input type="range" id="speed" min="0.5" max="3" step="0.25" value="1">
        </label>
      </section>

      <section>
        <h2>Assets</h2>
        <p id="assetInfo" class="hint"></p>
        <details><summary>Files still using placeholders</summary><ul id="assetList" class="mono small-list"></ul></details>
      </section>
    </div>
  </aside>
  <button id="showPanel" class="show-panel" hidden>Demo controls</button>
</div>

<script>
/* src/config.js */
/*
 * Game configuration: maths, animation timing and presentation switches.
 * The engine (engine.js) reads only this object, so the same file drives the
 * browser game and the Node simulator (tools/simulate.js).
 *
 * Sources:
 *   RULES  docs/official-game-rules.md
 *   PAY    docs/pay-table.md
 *   ANIM   docs/animation-specifications.md   (timings, banners)
 *   ASSET  docs/game-asset-specification.md   (asset IDs, win tiers)
 *   GDD    docs/reference-gdd.md
 *   TUNED  not published; tuned with tools/simulate.js to hit the published RTP / frequencies
 */
(function (root) {
  const CONFIG = {
    title: 'NESTING DOLLS',

    // ---------------------------------------------------------------- grid
    reels: 5,
    rows: 3,
    wildReel: 2,                       // RULES: Wild only on the middle reel (0-based index 2)

    // Symbol ids follow the asset spec tiers: 0 = sym_00 Yellow (highest) .. 6 = sym_06 Teal (lowest).
    // An upgrade moves a symbol one tier toward 0.
    tiers: [0, 1, 2, 3, 4, 5, 6],
    GHOST: 8,
    WILD: 9,
    symbolNames: {
      0: 'Yellow Grandmother', 1: 'Orange (glasses)', 2: 'Red', 3: 'Pink',
      4: 'Dark Purple', 5: 'Light Blue', 6: 'Teal (pacifier)', 9: 'Wild Egg', 8: 'Ghost'
    },

    // ------------------------------------------------------------ paylines (PAY section 6)
    // Row index per reel: 0 Top, 1 Middle, 2 Bottom.
    paylines: [
      [1, 1, 1, 1, 1],  //  1 M M M M M
      [0, 0, 0, 0, 0],  //  2 T T T T T
      [2, 2, 2, 2, 2],  //  3 B B B B B
      [1, 1, 0, 1, 1],  //  4 M M T M M
      [1, 1, 2, 1, 1],  //  5 M M B M M
      [0, 0, 1, 0, 0],  //  6 T T M T T
      [2, 2, 1, 2, 2],  //  7 B B M B B
      [0, 1, 1, 1, 0],  //  8 T M M M T
      [2, 1, 1, 1, 2],  //  9 B M M M B
      [1, 2, 2, 2, 1],  // 10 M B B B M
      [0, 1, 0, 1, 0],  // 11 T M T M T
      [1, 2, 1, 2, 1],  // 12 M B M B M
      [1, 0, 1, 0, 1],  // 13 M T M T M
      [2, 1, 2, 1, 2],  // 14 B M B M B
      [0, 2, 0, 2, 0],  // 15 T B T B T
      [2, 0, 2, 0, 2],  // 16 B T B T B
      [1, 0, 2, 0, 1]   // 17 M T B T M
    ],

    // ------------------------------------------------------------ paytable (PAY section 1)
    // Multiplier of TOTAL bet per line. The pay table lists euros at a €7.50 bet
    // (Ghost special €750 = 100x), so each value here is the euro amount / 7.5.
    paytable: {
      0: { 3: 0.50, 4: 1.00, 5: 2.00 },   // Yellow  €3.75 / €7.50 / €15.00
      1: { 3: 0.40, 4: 0.80, 5: 1.50 },   // Orange  €3.00 / €6.00 / €11.25
      2: { 3: 0.30, 4: 0.60, 5: 1.00 },   // Red     €2.25 / €4.50 / €7.50
      3: { 3: 0.20, 4: 0.40, 5: 0.80 },   // Pink    €1.50 / €3.00 / €6.00
      4: { 3: 0.20, 4: 0.40, 5: 0.70 },   // Purple  €1.50 / €3.00 / €5.25
      5: { 3: 0.10, 4: 0.20, 5: 0.50 },   // Blue    €0.75 / €1.50 / €3.75
      6: { 3: 0.10, 4: 0.20, 5: 0.40 }    // Teal    €0.75 / €1.50 / €3.00
    },
    specialWin: 100,                   // PAY 5.2: Ghost special win €750 at €7.50 bet = 100x

    // Symbol weights for random stops (TUNED). Each cell is drawn independently;
    // the Wild weight only applies on wildReel.
    weights: { 6: 21, 5: 21, 4: 20, 3: 20, 2: 20, 1: 19, 0: 19, 9: 3.7 },

    // ------------------------------------------------------------- bears (RULES 4, PAY 3)
    // A landed Wild shows a star with this chance; a star means it opens to a bear (TUNED).
    starChance: 0.29,
    starChanceFreeSpins: 0.08,
    bearWeights: { scare: 46, charm: 15, dance: 39 },               // TUNED
    bearWeightsFreeSpins: { scare: 62, charm: 30, dance: 8 },       // TUNED
    // Scare Bear size sets how many times the lowest symbols upgrade (PAY 3.1)
    scareSizes: { 1: 50, 2: 33, 3: 17 },                             // small / medium / large, weights TUNED

    // ---------------------------------------------------------- free spins (PAY 3.3, RULES 5)
    freeSpins: 7,
    freeSpinsRetrigger: true,          // ASSUMED: a Dance Bear during free spins adds 7 more
    guaranteedWildInFreeSpins: true,

    // ------------------------------------------------------------ wipe (RULES 6, PAY 5)
    wipeCountsWild: true,              // ASSUMED: Wild positions count as "the same" (else free spins could never wipe)

    maxWin: 390,                       // GDD: cap per round (base spin + any free spins it triggers)

    // ---------------------------------------------------------------- money
    bets: [0.10, 0.20, 0.50, 1, 2, 5, 7.5, 10, 20, 50, 100],  // GDD min / max
    defaultBetIndex: 7,
    startBalance: 1000,
    currency: '€',

    // ---------------------------------------------------------- big win banners (ASSET 7.2)
    // The animation spec lists five tiers from 25x; the asset spec adds NICE at 15x and BIG at 25x.
    // The asset spec is used here. The Ghost special win always shows the EPIC banner (ASSET 7.2).
    winTiers: [
      { id: 'nice',        min: 15,  label: 'NICE WIN!',        colors: ['#ffe2bf', '#d08a4a', '#7a4316'], fx: 'fountain' },
      { id: 'big',         min: 25,  label: 'BIG WIN!',         colors: ['#ffffff', '#c9d2dc', '#6c7a88'], fx: 'drop' },
      { id: 'mega',        min: 50,  label: 'MEGA WIN!',        colors: ['#fff4c2', '#f2b632', '#b0102a'], fx: 'cascade' },
      { id: 'superb',      min: 100, label: 'SUPERB WIN!',      colors: ['#e9ffe9', '#3fcf7a', '#b0102a'], fx: 'fireworks' },
      { id: 'sensational', min: 250, label: 'SENSATIONAL WIN!', colors: ['#f6e6ff', '#b46cff', '#e8b23a'], fx: 'lasers' },
      { id: 'epic',        min: 500, label: 'EPIC WIN!',        colors: ['#ffffff', '#8fd6ff', '#2f6fd6'], fx: 'epic' }
    ],

    // ------------------------------------------------------- animation timing (ANIM, frames at 30 fps)
    fps: 30,
    frames: {
      bgBaseLoop: 120,                  // bg_base_loop breathing
      bgFreeLoop: 90,                   // bg_freegame_loop
      fsLightCycle: 30,                 // party lights red/gold
      reel3Glow: 45,                    // guaranteed-wild outline sine
      symWin: [10, 20, 15],             // sym_xx_win / sym_xx_upgrade: pop, main action, settle/morph
      wildOpen: [15, 20, 10],           // sym_wild_star_open: land squash, star flash + hatch, bear emerge
      anticipation: [15, 30, 15],       // vfx_anticipation_reel3: ramp, sustain, slam stop
      scareWave: 22.5,                  // per upgrade; small 45f, medium 67f, large 90f
      scareEdge: 11.25,                 // intro and outro around the waves
      charm: [20, 25, 15],              // kiss, hearts sweep, upgrade shimmer
      dance: [45, 30],                  // accordion riff, hand-over to free spins
      wipe: [30, 30, 30],               // golden frame lock, flash sweep + morph, ghost transform / settle
      banner: [30, 90, 30],             // every modal and big win banner
      bannerTally: [30, 105],           // big win count-up frames inside the banner
      summaryTally: 75,                 // free spins summary count-up
      transToFree: [15, 45, 15],        // trans_base_to_freegame
      transToBase: 60                   // trans_freegame_to_base
    },
    anticipateOn: 'star',               // 'star' = only when the Wild will open; 'wild' = any Wild on reel 3; 'off'
    autoContinueModals: true,           // START / COLLECT continue by themselves after the hold (handy for recording)

    // reel spin feel (not in the spec; GDD spin 1.5-2.0s, 0.2-0.3s per reel)
    spin: { first: 1.5, gap: 0.25, speed: 22, bounce: 1.2 },

    showLevelBadges: true,    // small tier tags on placeholder dolls only
    stage: { landscape: [1920, 1080] }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = CONFIG;
  else root.CONFIG = CONFIG;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* assets/manifest.js */
/*
 * ASSET MANIFEST
 * ---------------------------------------------------------------------------
 * Keys are the asset IDs from docs/game-asset-specification.md
 * ([type]_[category]_[asset_name]_[state]). To replace placeholder art or
 * sound, save a file at the listed path (or change the path) and reload.
 * Missing files keep the built-in placeholder, so assets can be swapped one by one.
 *
 * Sizes (PNG with transparency unless noted):
 *   sym_*  .................................. 300 x 300, centred, same framing for every symbol
 *   bg_*_main ............................... 1920 x 1080 (no transparency needed)
 *   bg_*_frame .............................. 1920 x 1080 overlay, transparent where the reels show
 *   bg_base_reel_strip ...................... one reel column, about 270 x 810 (stretched to the column)
 *   btn_* ................................... about 160 x 160 (spin), 80 x 80 (others)
 *   ui_bar_bottom ........................... 1920 x 110
 *   modal_freespins_* ....................... about 1100 x 620 panel; text is drawn on top
 *   banner_win_* ............................ about 1200 x 360 title art; the amount is drawn below it
 * The symbol upgrade animation splits each doll at symbolSplitY (fraction of height)
 * into a lid and a base; keep the doll's seam near that line or change the value.
 *
 * Sounds: MP3 or WAV. They only load when the game is served over http(s) (README: "Run it").
 * Spine 2D skeletons listed in the asset spec are not wired in yet; see README "Next steps".
 */
window.ASSET_MANIFEST = {
  symbolSplitY: 0.47,

  images: {
    // 2.1 environment
    bg_base_main:        'assets/images/environment/bg_base_main.png',
    bg_base_frame:       'assets/images/environment/bg_base_frame.png',
    bg_base_reel_strip:  'assets/images/environment/bg_base_reel_strip.png',
    // 3.1 free game environment
    bg_freegame_main:    'assets/images/environment/bg_freegame_main.png',
    bg_freegame_frame:   'assets/images/environment/bg_freegame_frame.png',
    fx_reel3_guaranteed_wild_indicator: 'assets/images/fx/fx_reel3_guaranteed_wild_indicator.png',

    // 2.2 UI / HUD
    ui_bar_bottom:       'assets/images/ui/ui_bar_bottom.png',
    btn_spin_idle:       'assets/images/ui/btn_spin_idle.png',
    btn_spin_active:     'assets/images/ui/btn_spin_active.png',
    btn_spin_disabled:   'assets/images/ui/btn_spin_disabled.png',
    btn_auto_idle:       'assets/images/ui/btn_auto_idle.png',
    btn_auto_active:     'assets/images/ui/btn_auto_active.png',
    btn_bet_plus:        'assets/images/ui/btn_bet_plus.png',
    btn_bet_minus:       'assets/images/ui/btn_bet_minus.png',
    btn_info:            'assets/images/ui/btn_info.png',
    ui_freegame_counter: 'assets/images/ui/ui_freegame_counter.png',

    // 4.1 standard symbols (idle frames)
    sym_00_idle: 'assets/images/symbols/sym_00_grandmother_idle.png',   // Tier 0 Yellow (highest)
    sym_01_idle: 'assets/images/symbols/sym_01_glasses_idle.png',       // Tier 1 Orange
    sym_02_idle: 'assets/images/symbols/sym_02_red_idle.png',           // Tier 2 Red
    sym_03_idle: 'assets/images/symbols/sym_03_pink_idle.png',          // Tier 3 Pink
    sym_04_idle: 'assets/images/symbols/sym_04_purple_idle.png',        // Tier 4 Dark Purple
    sym_05_idle: 'assets/images/symbols/sym_05_blue_idle.png',          // Tier 5 Light Blue
    sym_06_idle: 'assets/images/symbols/sym_06_pacifier_idle.png',      // Tier 6 Teal (lowest)

    // 4.2 special and mystery symbols
    sym_wild_idle:        'assets/images/symbols/sym_wild_idle.png',
    sym_wild_star_idle:   'assets/images/symbols/sym_wild_star_idle.png',
    sym_bear_scare_small: 'assets/images/symbols/sym_bear_scare_small.png',
    sym_bear_scare_med:   'assets/images/symbols/sym_bear_scare_med.png',
    sym_bear_scare_large: 'assets/images/symbols/sym_bear_scare_large.png',
    sym_bear_charm:       'assets/images/symbols/sym_bear_charm.png',
    sym_bear_dance:       'assets/images/symbols/sym_bear_dance.png',
    sym_ghost_idle:       'assets/images/symbols/sym_ghost_idle.png',

    // 7 banners and modals (panel / title art; text and amounts are drawn on top)
    modal_freespins_intro:   'assets/images/banners/modal_freespins_intro.png',
    modal_freespins_outro:   'assets/images/banners/modal_freespins_outro.png',
    banner_win_nice:         'assets/images/banners/banner_win_nice.png',
    banner_win_big:          'assets/images/banners/banner_win_big.png',
    banner_win_mega:         'assets/images/banners/banner_win_mega.png',
    banner_win_superb:       'assets/images/banners/banner_win_superb.png',
    banner_win_sensational:  'assets/images/banners/banner_win_sensational.png',
    banner_win_epic:         'assets/images/banners/banner_win_epic.png',

    // 8 pay line visualisation (line_overlay_01..17 are drawn as paths in code)
    line_node_highlight:     'assets/images/fx/line_node_highlight.png'
  },

  sounds: {
    bgm_basegame_loop:      'assets/audio/bgm_basegame_loop.mp3',
    bgm_freegame_loop:      'assets/audio/bgm_freegame_loop.mp3',
    sfx_spin_button_click:  'assets/audio/sfx_spin_button_click.mp3',
    sfx_reel_spin:          'assets/audio/sfx_reel_spin.mp3',
    sfx_reel_stop_01:       'assets/audio/sfx_reel_stop_01.mp3',
    sfx_reel_stop_02:       'assets/audio/sfx_reel_stop_02.mp3',
    sfx_reel_stop_03:       'assets/audio/sfx_reel_stop_03.mp3',
    sfx_reel_stop_04:       'assets/audio/sfx_reel_stop_04.mp3',

<script>
/* src/engine.js */
/*
 * Game engine: pure maths, no drawing. Follows docs/official-game-rules.md.
 *
 * resolveSpin(grid) takes the stopped reels and returns a list of steps:
 *   hatch  a landed Wild shows a star and opens to a bear
 *   bear   the bear's effect (Scare: lowest symbols upgrade 1-3 times, Charm: all
 *          symbols upgrade once, Dance: free spins)
 *   win    new or improved payline wins (only the highest win per line is paid)
 *   pop    winning symbols of one value upgrade, when that creates new or longer lines
 *   wipe   all 15 symbols the same: they upgrade once more (Yellow -> Ghost = special win)
 * The renderer plays these steps in order, so what you see is what the maths decided.
 *
 * Grid format: grid[reel][row] = symbol id (0..6 doll tier, 0 = Yellow highest; 9 Wild; 8 Ghost).
 * Works in the browser (window.Engine) and in Node (require('./engine')).
 */
(function (root) {
  function create(CONFIG, rng) {
    rng = rng || Math.random;
    const C = CONFIG, W = C.WILD, R = C.rows, N = C.reels;
    const round2 = v => Math.round(v * 100) / 100;
    const clone = g => g.map(col => col.slice());

    function pickWeighted(table) {
      let total = 0; for (const k in table) total += table[k];
      let r = rng() * total;
      for (const k in table) { r -= table[k]; if (r <= 0) return k; }
      return Object.keys(table).pop();
    }
    function randomSymbol(reel, allowWild = true) {
      const t = {};
      for (const k in C.weights) {
        const id = Number(k);
        if (id === W && (reel !== C.wildReel || !allowWild)) continue;
        t[k] = C.weights[k];
      }
      return Number(pickWeighted(t));
    }

    /** Random stop. opts.forceWild guarantees a Wild on the wild reel (free spins). */
    function randomGrid(opts = {}) {
      const g = [];
      for (let c = 0; c < N; c++) {
        g.push([]);
        for (let r = 0; r < R; r++) g[c].push(randomSymbol(c, opts.allowWild !== false));
      }
      if (opts.forceWild && !g[C.wildReel].includes(W)) g[C.wildReel][Math.floor(rng() * R)] = W;
      return g;
    }

    /** Evaluate all paylines: highest win per line, left to right, no gaps. */
    function evaluate(grid) {
      const wins = [];
      C.paylines.forEach((line, li) => {
        let sym = null, count = 0, hasWild = false;
        for (let c = 0; c < N; c++) {
          const s = grid[c][line[c]];
          if (s === C.GHOST) break;
          if (s === W) { hasWild = true; count++; continue; }
          if (sym === null) { sym = s; count++; continue; }
          if (s === sym) { count++; continue; }
          break;
        }
        if (sym === null || count < 3) return;
        const pay = C.paytable[sym] && C.paytable[sym][Math.min(count, 5)];
        if (!pay) return;
        const positions = [];
        for (let c = 0; c < count; c++) positions.push([c, line[c]]);
        wins.push({ line: li, sym, count, pay, hasWild, positions });
      });
      return wins;
    }

    const upgraded = (s, n = 1) => (s === W || s === C.GHOST) ? s : Math.max(0, s - n);

    /** The single symbol filling the board, or null. Wilds count as matching if configured. */
    function sameSymbol(grid) {
      let sym = null;
      for (let c = 0; c < N; c++) for (let r = 0; r < R; r++) {
        const s = grid[c][r];
        if (s === W && C.wipeCountsWild) continue;
        if (sym === null) sym = s; else if (s !== sym) return null;
      }
      return sym;
    }

    function lowestValue(grid) {           // highest tier number = lowest value
      let worst = -1;
      for (let c = 0; c < N; c++) for (let r = 0; r < R; r++) { const s = grid[c][r]; if (s !== W && s !== C.GHOST && s > worst) worst = s; }
      return worst;
    }

    function applyBear(grid, bear, size) {
      if (bear === 'charm') {
        const changes = [];
        for (let c = 0; c < N; c++) for (let r = 0; r < R; r++) {
          const s = grid[c][r], t = upgraded(s);
          if (t !== s) { changes.push({ c, r, from: s, to: t }); grid[c][r] = t; }
        }
        return { bear, changes };
      }
      if (bear === 'scare') {
        // the lowest valued symbols upgrade, repeated 1-3 times (bear size)
        const rounds = [];
        for (let i = 0; i < size; i++) {
          const worst = lowestValue(grid);
          if (worst <= 0) break;
          const ch = [];
          for (let c = 0; c < N; c++) for (let r = 0; r < R; r++) if (grid[c][r] === worst) { ch.push({ c, r, from: worst, to: worst - 1 }); grid[c][r] = worst - 1; }
          rounds.push(ch);
        }
        return { bear, size, rounds, changes: [].concat(...rounds) };
      }
      return { bear: 'dance', changes: [], freeSpins: C.freeSpins };
    }

    /** Does upgrading change the board into one with new or longer paylines? */
    function newOrLonger(before, after) {
      const prev = {}; before.forEach(w => { prev[w.line] = w.count; });
      return after.some(w => !(w.line in prev) || w.count > prev[w.line]);
    }

    /**
     * Play out a stopped grid.
     * opts.bet          total bet
     * opts.inFreeSpins
     * opts.forceBear    'scare' | 'charm' | 'dance' (a landed Wild then always shows a star)
     * opts.forceStar    true/false to force or block the star
     * opts.scareSize    1 | 2 | 3
     * Returns { start, end, steps, total (money), freeSpins }
     */
    function resolveSpin(startGrid, opts = {}) {
      const bet = opts.bet || 1, fs = !!opts.inFreeSpins;
      const grid = clone(startGrid), steps = [];
      const linePaid = {};             // line -> best pay multiplier so far
      let lineTotal = 0, special = 0, freeSpins = 0;
      const total = () => round2(lineTotal * bet + special);

      // 1. a landed Wild may show a star and open to a bear (one per spin)
      let wildPos = null;
      for (let r = 0; r < R; r++) if (grid[C.wildReel][r] === W) { wildPos = [C.wildReel, r]; break; }
      if (wildPos) {
        const star = opts.forceBear ? true : (opts.forceStar != null ? opts.forceStar : rng() < (fs ? C.starChanceFreeSpins : C.starChance));
        if (star) {
          const bear = opts.forceBear || pickWeighted(fs ? C.bearWeightsFreeSpins : C.bearWeights);
          const size = bear === 'scare' ? (opts.scareSize || Number(pickWeighted(C.scareSizes))) : 2;
          steps.push({ type: 'hatch', bear, size, pos: wildPos });
          const eff = applyBear(grid, bear, size);
          if (eff.freeSpins) freeSpins += eff.freeSpins;
          steps.push(Object.assign({ type: 'bear' }, eff));
        }
      }

      // 2. pay wins, upgrade winning symbols while that makes new or longer lines, then check for a wipe
      let wiped = false;
      for (let guard = 0; guard < 60; guard++) {
        const wins = evaluate(grid);
        const improved = [];
        wins.forEach(w => {
          const prev = linePaid[w.line] || 0;
          if (w.pay > prev) { improved.push(Object.assign({}, w, { amount: round2((w.pay - prev) * bet) })); lineTotal += w.pay - prev; linePaid[w.line] = w.pay; }
        });
        if (improved.length) steps.push({ type: 'win', wins: improved, amount: round2(improved.reduce((a, w) => a + w.amount, 0)), total: total() });

        // which values qualify for an upgrade
        const byRank = {};
        wins.forEach(w => w.positions.forEach(([c, r]) => {
          const s = grid[c][r]; if (s === W || s <= 0) return;
          (byRank[s] = byRank[s] || new Set()).add(c + ',' + r);
        }));
        const pops = [];
        Object.keys(byRank).forEach(rank => {
          const test = clone(grid), list = [...byRank[rank]].map(k => k.split(',').map(Number));
          list.forEach(([c, r]) => { test[c][r] = upgraded(test[c][r]); });
          if (newOrLonger(wins, evaluate(test))) list.forEach(([c, r]) => pops.push({ c, r, from: grid[c][r], to: upgraded(grid[c][r]) }));
        });
        if (pops.length) {
          pops.forEach(p => { grid[p.c][p.r] = p.to; });
          steps.push({ type: 'pop', changes: pops });
          continue;
        }

        // all win upgrades done: wipe if the whole board is one symbol (once per spin)
        const same = sameSymbol(grid);
        if (!wiped && same !== null && same !== C.GHOST) {
          wiped = true;
          const changes = [];
          const to = same === 0 ? C.GHOST : same - 1;
          for (let c = 0; c < N; c++) for (let r = 0; r < R; r++) if (grid[c][r] !== W) { changes.push({ c, r, from: grid[c][r], to }); grid[c][r] = to; }
          if (to === C.GHOST) {
            special = round2(C.specialWin * bet);
            steps.push({ type: 'wipe', special: true, from: same, changes, amount: special, total: total() });
            break;
          }
          steps.push({ type: 'wipe', special: false, from: same, changes, amount: 0, total: total() });
          continue;                    // re-evaluate the upgraded board
        }
        break;
      }

      return { start: clone(startGrid), end: grid, steps, total: total(), freeSpins };
    }

    /** Index into CONFIG.winTiers for a win, or -1 when it is below the first banner. */
    function tierOf(total, bet) {
      const x = total / bet; let t = -1;
      C.winTiers.forEach((w, i) => { if (x >= w.min) t = i; });
      return t;
    }

    return { randomGrid, randomSymbol, evaluate, resolveSpin, sameSymbol, tierOf, clone, pickWeighted };
  }

  const Engine = { create };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* src/director.js */
/*
 * Director: builds scripted outcomes for demos.
 * Each outcome is a stopped grid plus its resolved steps, found by searching
 * random grids until one matches what was asked for. Pure logic, no drawing.
 */
(function (root) {
  const OUTCOMES = {
    random:   { label: 'Random spin',             color: '#8d8aa6' },
    nowin:    { label: 'No win',                  color: '#6c6a80' },
    small:    { label: 'Single win',              color: '#4fbf8a' },
    chain:    { label: 'Upgrade chain (2+ pops)', color: '#3fb6c9' },
    scare:    { label: 'Scare Bear (small, 1×)',  color: '#e0794a' },
    scare3:   { label: 'Scare Bear (large, 3×)',  color: '#d9552a' },
    charm:    { label: 'Charm Bear',              color: '#e05aa0' },
    dance:    { label: 'Dance Bear → Free Spins', color: '#9b6bff' },
    nice:     { label: 'Nice win banner (15×+)',  color: '#d08a4a' },
    big:      { label: 'Big win banner (25×+)',   color: '#ff9a3c' },
    wipe:     { label: 'Wipe Win',                color: '#f2c13a' },
    ghost:    { label: 'Wipe → Ghost (100×)',     color: '#fff3a8' },
    custom:   { label: 'Custom grid',             color: '#2fd0c0' }
  };

  function create(CONFIG, engine) {
    const C = CONFIG, W = C.WILD;
    const rnd = n => Math.floor(Math.random() * n);

    function withWild(g) { g[C.wildReel][rnd(C.rows)] = W; return g; }
    function uniformGrid(pool, wild) {
      const g = [];
      for (let c = 0; c < C.reels; c++) { g.push([]); for (let r = 0; r < C.rows; r++) g[c].push(pool[rnd(pool.length)]); }
      return wild ? withWild(g) : g;
    }

    function search(test, make, tries = 5000) {
      let best = null;
      for (let i = 0; i < tries; i++) {
        const { grid, opts } = make();
        const res = engine.resolveSpin(grid, opts);
        const score = test(res);
        if (score === true) return res;
        if (typeof score === 'number' && (!best || score > best.score)) best = { score, res };
      }
      return best ? best.res : engine.resolveSpin(make().grid, make().opts);
    }

    const count = (res, type) => res.steps.filter(s => s.type === type).length;
    const bearOf = res => (res.steps.find(s => s.type === 'hatch') || {}).bear;
    const wipeOf = res => res.steps.find(s => s.type === 'wipe');

    /** Build an outcome. ctx = { bet, inFreeSpins } */
    function build(item, ctx) {
      const bet = ctx.bet, fs = !!ctx.inFreeSpins;
      const base = { bet, inFreeSpins: fs };
      const forceWild = fs && C.guaranteedWildInFreeSpins;
      const noBear = Object.assign({}, base, { forceStar: false });
      const quiet = () => ({ grid: engine.randomGrid({ allowWild: forceWild, forceWild }), opts: noBear });
      const bearMake = (bear, extra = {}) => () => ({ grid: withWild(engine.randomGrid({ allowWild: false })), opts: Object.assign({}, base, { forceBear: bear }, extra) });

      switch (item.type) {
        case 'nowin':
          return search(r => r.total === 0, quiet);
        case 'small':
          return search(r => (count(r, 'win') === 1 && r.total / bet >= .2 && r.total / bet < C.winTiers[0].min && !wipeOf(r)) || (r.total > 0 ? .5 : 0), quiet);
        case 'chain':
          return search(r => (count(r, 'pop') >= 2 && !wipeOf(r)) || count(r, 'pop'), quiet, 8000);
        case 'scare':
          return search(r => (r.total > 0 && r.total / bet < C.winTiers[0].min && !wipeOf(r)) || .5, bearMake('scare', { scareSize: 1 }));
        case 'scare3':
          return search(r => (r.total > 0 && count(r, 'pop') >= 1 && !wipeOf(r)) || r.total, bearMake('scare', { scareSize: 3 }));
        case 'charm':
          return search(r => (count(r, 'win') >= 1 && count(r, 'pop') >= 1 && !wipeOf(r)) || r.total, bearMake('charm'));
        case 'dance':
          return search(r => bearOf(r) === 'dance' || false, bearMake('dance'), 50);
        case 'nice': case 'big': {
          // without a wipe a single spin tops out at 34x (17 lines x Yellow 5-of-a-kind)
          const lo = item.type === 'nice' ? 15 : 25, hi = item.type === 'nice' ? 25 : 50;
          return search(r => (r.total / bet >= lo && r.total / bet < hi && !wipeOf(r)) || (wipeOf(r) ? 0 : Math.min(r.total, lo * bet)), () => {
            const g = uniformGrid([0, 0, 1, 1, 2, 3, 4, 5, 6], true);
            return { grid: g, opts: Object.assign({}, base, { forceBear: Math.random() < .5 ? 'charm' : 'scare', scareSize: 3 }) };
          }, 8000);
        }
        case 'wipe':
          // a near-uniform board that chains into a full board of one value (not Yellow)
          return search(r => { const w = wipeOf(r); return (w && !w.special) || false; },
            () => { const lv = 1 + rnd(4); return { grid: uniformGrid([lv, lv, lv, lv, lv + 1], fs || Math.random() < .3), opts: noBear }; }, 8000);
        case 'ghost':
          return search(r => { const w = wipeOf(r); return (w && w.special) || false; },
            () => ({ grid: uniformGrid([0, 0, 0, 0, 0, 0, 1], fs || Math.random() < .3), opts: noBear }), 8000);
        case 'custom': {
          const g = item.grid.map(col => col.slice());
          if (forceWild && !g[C.wildReel].includes(W)) g[C.wildReel][1] = W;
          const opts = item.bear ? Object.assign({}, base, { forceBear: item.bear, scareSize: item.scareSize }) : noBear;
          return engine.resolveSpin(g, opts);
        }
        default:
          return engine.resolveSpin(engine.randomGrid({ forceWild }), base);
      }
    }
    return { build };
  }

  const Director = { create, OUTCOMES };
  if (typeof module !== 'undefined' && module.exports) module.exports = Director;
  else root.Director = Director;
})(typeof window !== 'undefined' ? window : globalThis);

/* src/placeholders.js */
/*
 * Placeholder art, drawn in code.

 * so when a real image exists in assets/images/ it simply replaces the result.
 */
(function (root) {

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  const DOLL = {
    6: { c: ['#a6e6dc', '#46a89f', '#1c5c57'], face: 'dummy' },
    5: { c: ['#b8d8ff', '#5c8fe0', '#22377f'], face: 'open' },
    4: { c: ['#d4b0ff', '#7a3fc8', '#3a1470'], face: 'open' },
    3: { c: ['#ffc0ea', '#d662b7', '#74205a'], face: 'smile' },
    2: { c: ['#ffaba4', '#e2463f', '#7a1612'], face: 'open' },
    1: { c: ['#ffd7a6', '#f08b2e', '#83400b'], face: 'glasses' },

        x.fillStyle = opts.ghost ? '#6aa7a0' : '#2d6f69'; x.beginPath(); x.arc(cx + s * ex + r * .03, ey + r * .02, er * .55, 0, 7); x.fill();

/* src/assets.js */
/*
 * Asset loader. Tries every path in assets/manifest.js and falls back to the
 * placeholder art in placeholders.js when a file is missing. UI buttons,
 * modals and banners have no placeholder image: game.js draws them in code

 */
(function (root) {
  const P = root.Placeholders;
  const Assets = { img: {}, real: {}, splitY: .47, W: 1920, H: 1080, L: null };

  function loadImage(src) {
    return new Promise(res => {
      if (!src) return res(null);

      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = src;
    });
  }

    const { W, H, L } = Assets;
    let m;
    if ((m = key.match(/^sym_0(\d)_idle$/))) return P.doll(Number(m[1]));
    if ((m = key.match(/^sym_0(\d)_scared$/))) return P.doll(Number(m[1]), { scared: true });

      case 'sym_wild_idle': return P.wild(false);

      case 'sym_bear_scare_small': case 'sym_bear_scare_med': case 'sym_bear_scare_large': return P.bear('scare');
      case 'sym_bear_charm': return P.bear('charm');
      case 'sym_bear_dance': return P.bear('dance');
      case 'sym_ghost_idle': return P.ghost();
      case 'bg_base_main': return P.woodBg(W, H, false);
      case 'bg_freegame_main': return P.woodBg(W, H, true);
      case 'bg_base_frame': return P.frame(W, H, L, false);
      case 'bg_freegame_frame': return P.frame(W, H, L, true);

      case 'line_node_highlight': return P.nodeRing();

      else if (s.type === 'pop') { const t1 = now(); s.changes.forEach(ch => { G.fx[ch.c][ch.r].up = { t0: t1, from: ch.from }; G.board[ch.c][ch.r] = ch.to; }); SND.play('sfx_symbol_upgrade'); await waitF(FR.symWin[1] + FR.symWin[2]); }

    const hasWild = res.start[C.wildReel].includes(C.WILD);
    const antic = C.anticipateOn === 'wild' ? hasWild : C.anticipateOn === 'star' ? !!hatch : false;
    if (!inFS) { G.balance = Math.round((G.balance - bet()) * 100) / 100; setWin(0, true); }
    G.spinBaseWin = G.win;      // the HUD win box keeps the round total during free spins
    SND.play('sfx_spin_button_click'); SND.play('sfx_reel_spin');
    G.spinning = true; G.onChange();
    await startReels(res.start, antic);
    G.spinning = false; G.onChange();
    if (hatch) await waitF(4);
    await playSteps(res.steps);
    const wipe = res.steps.find(st => st.type === 'wipe');
    await bigWinBanner(res.total, { ghost: wipe && wipe.special });
    return res;
  }
  function nextItem() {
    const it = G.queue.length ? G.queue.shift() : { type: 'random' };
    G.onChange(); return it;
  }

  async function play() {
    if (G.busy || G.info) return false;
    G.busy = true; G.onChange(); SND.init(root.ASSET_MANIFEST); SND.playMusic('bgm_basegame_loop');
    try {
      const base = await spinOnce(nextItem(), false);
      let roundWin = base.total;
      if (base.freeSpins) roundWin = await freeSpins(base.freeSpins, roundWin);
      roundWin = Math.min(roundWin, C.maxWin * bet());
      G.balance = Math.round((G.balance + roundWin) * 100) / 100;
      setWin(roundWin, true);
    } catch (e) { console.error(e); }
    G.busy = false; G.onChange();
    return true;
  }
  async function freeSpins(count, roundWin) {
    const fs = G.fs;
    Object.assign(fs, { left: count, played: 0, total: 0, awarded: count });
    await modal({ kind: 'intro', text1: 'YOU WON', text2: `${count} FREE SPINS!`, onOutro: () => {} });
    await transition('toFree', () => { fs.active = true; G.envTarget = 1; G.env = 1; SND.playMusic('bgm_freegame_loop'); });
    while (fs.left > 0) {
      fs.left--; fs.played++;
      await wait(.35 / G.speed);
      const r = await spinOnce(nextItem(), true);
      fs.total = Math.round((fs.total + r.total) * 100) / 100; roundWin += r.total;
      if (r.freeSpins && C.freeSpinsRetrigger) {
        await modal({ kind: 'intro', text1: 'YOU WON', text2: `${r.freeSpins} MORE FREE SPINS!` });
        fs.left += r.freeSpins; fs.awarded += r.freeSpins;
      }
      if (roundWin >= C.maxWin * bet()) { roundWin = C.maxWin * bet(); break; }
    }
    await wait(.4 / G.speed);
    await modal({ kind: 'outro', amount: fs.total, spins: fs.played, onOutro: () => { fs.active = false; G.envTarget = 0; } });
    await transition('toBase');
    SND.playMusic('bgm_basegame_loop');
    return roundWin;
  }
  async function autoplayLoop() {
    G.autoplay = !G.autoplay; G.onChange();
    while (G.autoplay) { await play(); if (G.autoplay) await wait(.5); }
  }
  async function playQueue(n) {
    G.autoplay = true; G.onChange();
    let i = 0; const max = n ?? G.queue.length;
    while (G.autoplay && i < max) { await play(); i++; if (i < max) await wait(.8); }
    G.autoplay = false; G.onChange();
  }

  /* ------------------------------------------------------------ input */
  cv.addEventListener('pointerdown', e => {
    SND.init(root.ASSET_MANIFEST);
    const rc = cv.getBoundingClientRect(), x = (e.clientX - rc.left) / rc.width * W, y = (e.clientY - rc.top) / rc.height * H;
    if (G.info) { G.info = false; return; }
    const hit = b => Math.hypot(x - b.x, y - b.y) <= b.r * 1.15;
    if (hit(btn.spin)) { if (!G.busy) play(); else G.skip++; return; }
    if (hit(btn.auto)) { autoplayLoop(); return; }
    if (hit(btn.info)) { if (!G.busy) G.info = true; return; }
    if (hit(btn.sound)) { SND.setMuted(!SND.muted); return; }
    if (hit(btn.minus)) { if (!G.busy) { G.betIndex = Math.max(0, G.betIndex - 1); G.onChange(); } return; }
    if (hit(btn.plus)) { if (!G.busy) { G.betIndex = Math.min(C.bets.length - 1, G.betIndex + 1); G.onChange(); } return; }
    G.skip++;
  });
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    const tg = e.target.tagName; if (tg === 'INPUT' || tg === 'SELECT' || tg === 'BUTTON' || tg === 'TEXTAREA') return;
    e.preventDefault(); SND.init(root.ASSET_MANIFEST); if (G.info) G.info = false; else if (G.busy) G.skip++; else play();
  });

  /* ------------------------------------------------------------ boot */
  async function boot() {
    try { await Promise.race([Promise.all([document.fonts.load(`80px ${SCRIPT}`), document.fonts.load(`80px ${BLOCK}`)]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
    G.assetInfo = await A.load(root.ASSET_MANIFEST, W, H, L);
    requestAnimationFrame(frame);
    G.onChange();
  }

  root.Game = { G, C, engine, director, play, playQueue, autoplayLoop, boot, canvas: cv, bet, cellCenter };
})(window);

</script>
<script>
/* src/devpanel.js */
/*
 * Demo controls panel: outcome list, custom grid, recording, asset status.
 * Not part of the game itself; hide it with the D key.
 */
(function (root) {
  const { G, C, engine } = root.Game, A = root.Assets, OUT = root.Director.OUTCOMES;
  const $ = s => document.querySelector(s), cv = root.Game.canvas;

  /* ---------- canvas fit ---------- */
  function fit() {
    const r = $('#wrap').getBoundingClientRect(), k = Math.min((r.width - 24) / cv.width, (r.height - 24) / cv.height);
    cv.style.width = Math.floor(cv.width * k) + 'px'; cv.style.height = Math.floor(cv.height * k) + 'px';
  }
  new ResizeObserver(fit).observe($('#wrap'));

  /* ---------- panel toggle ---------- */
  const togglePanel = show => { $('#app').classList.toggle('no-panel', !show); $('#showPanel').hidden = show; setTimeout(fit, 0); };
  $('#hidePanel').onclick = () => togglePanel(false);
  $('#showPanel').onclick = () => togglePanel(true);
  document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'd' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) togglePanel($('#app').classList.contains('no-panel')); });

  /* ---------- queue ---------- */
  G.queue = [{ type: 'small' }, { type: 'chain' }, { type: 'scare3' }, { type: 'charm' }, { type: 'nice' }, { type: 'wipe' }, { type: 'dance' }, { type: 'ghost' }];
  function renderQueue() {
    const q = $('#queue'); q.innerHTML = '';
    if (!G.queue.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Empty: spins are random.'; q.appendChild(li); }
    G.queue.forEach((it, i) => {
      const o = OUT[it.type] || OUT.random, li = document.createElement('li');
      li.innerHTML = `<span class="lbl"><span class="dot" style="background:${o.color}"></span>${o.label}${it.bear ? ' · ' + it.bear : ''}</span>`;
      const up = document.createElement('button'); up.textContent = '↑'; up.title = 'Move up'; up.disabled = i === 0;
      up.onclick = () => { [G.queue[i - 1], G.queue[i]] = [G.queue[i], G.queue[i - 1]]; renderQueue(); };
      const rm = document.createElement('button'); rm.textContent = '✕'; rm.title = 'Remove';
      rm.onclick = () => { G.queue.splice(i, 1); renderQueue(); };
      li.append(up, rm); q.appendChild(li);
    });
  }
  const adds = $('#adds');
  ['nowin', 'small', 'chain', 'nice', 'big', 'scare', 'scare3', 'charm', 'dance', 'wipe', 'ghost', 'random'].forEach(k => {
    const b = document.createElement('button'); b.innerHTML = `<span class="dot" style="background:${OUT[k].color}"></span>${OUT[k].label}`;
    b.onclick = () => { G.queue.push({ type: k }); renderQueue(); }; adds.appendChild(b);
  });
  $('#clearQueue').onclick = () => { G.queue = []; renderQueue(); };
  $('#playQueue').onclick = () => { if (G.autoplay) { G.autoplay = false; update(); } else if (!G.busy) root.Game.playQueue(); };
  $('#spin').onclick = () => root.Game.play();

  /* ---------- custom grid ---------- */
  const ED_SYMS = [6, 5, 4, 3, 2, 1, 0, C.WILD];
  let pick = 3, edGrid = engine.randomGrid({ allowWild: false });
  const thumb = id => { const im = A.symbol(id, C); if (!im) return ''; if (im.src) return im.src; const c = document.createElement('canvas'); c.width = c.height = 72; c.getContext('2d').drawImage(im, 0, 0, 72, 72); return c.toDataURL(); };
  const thumbs = {};
  function renderPalette() {
    const p = $('#palette'); p.innerHTML = '';
    ED_SYMS.forEach(id => { const b = document.createElement('button'); b.title = C.symbolNames[id]; b.setAttribute('aria-pressed', String(pick === id));
      b.innerHTML = `<img alt="${C.symbolNames[id]}" src="${thumbs[id]}">`; b.onclick = () => { pick = id; renderPalette(); }; p.appendChild(b); });
  }
  function renderEditor() {
    const ge = $('#gridEd'); ge.innerHTML = '';
    for (let r = 0; r < C.rows; r++) for (let c = 0; c < C.reels; c++) {
      const s = edGrid[c][r], b = document.createElement('button'); b.title = `Reel ${c + 1}, row ${r + 1}: ${C.symbolNames[s]}`;
      if (c === C.wildReel) b.className = 'wild-col';
      b.innerHTML = `<img alt="${C.symbolNames[s]}" src="${thumbs[s]}">`;
      b.onclick = () => { if (pick === C.WILD && c !== C.wildReel) { info('The Wild Egg only lands on reel 3.'); return; } edGrid[c][r] = pick; renderEditor(); };
      ge.appendChild(b);
    }
    const { bear, scareSize } = edBear();
    const hasWild = edGrid[C.wildReel].includes(C.WILD);
    const res = engine.resolveSpin(edGrid, bear && hasWild ? { bet: root.Game.bet(), forceBear: bear, scareSize } : { bet: root.Game.bet(), forceStar: false });
    const pops = res.steps.filter(s => s.type === 'pop').length, wipe = res.steps.find(s => s.type === 'wipe');
    const parts = [res.total > 0 ? `Pays <b>${C.currency}${res.total.toFixed(2)}</b> (${(res.total / root.Game.bet()).toFixed(1)}× bet)` : 'No win'];
    if (pops) parts.push(`${pops} upgrade round${pops > 1 ? 's' : ''}`);
    if (bear && hasWild) parts.push(`Wild opens: <b>${$('#edBear').selectedOptions[0].text}</b>`);
    else if (bear) parts.push('add a Wild on reel 3 for the bear');
    if (wipe) parts.push(wipe.special ? '<b>wipe → Ghost special win</b>' : '<b>wipe win</b>');
    info(parts.join(' · '));
  }
  const info = h => { $('#edInfo').innerHTML = h; };
  function edBear() { const v = $('#edBear').value; if (!v) return {}; const [bear, size] = v.split(':'); return { bear, scareSize: size ? Number(size) : undefined }; }
  $('#edBear').onchange = renderEditor;
  $('#addCustom').onclick = () => { const b = edBear(); G.queue.push({ type: 'custom', grid: edGrid.map(c => c.slice()), bear: b.bear, scareSize: b.scareSize }); renderQueue(); };
  $('#copyBoard').onclick = () => { edGrid = G.board.map(c => c.map(s => (s === C.GHOST ? 0 : s))); renderEditor(); };

  /* ---------- speed ---------- */
  $('#speed').oninput = e => { G.speed = Number(e.target.value); $('#speedOut').textContent = G.speed + '×'; };

  /* ---------- recording ---------- */
  let rec = null, chunks = [], t0 = 0, timer = 0, downloads = null;
  function mime() {
    for (const m of ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'])
      if (root.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }
  function startRec() {
    if (rec) return true;
    if (!root.MediaRecorder || !cv.captureStream) { $('#recOut').textContent = 'This browser cannot record the canvas. Use Chrome or Edge.'; return false; }
    root.Audio2.init(root.ASSET_MANIFEST);
    const tracks = [...cv.captureStream(C.fps || 30).getVideoTracks()];
    if (root.Audio2.recDest) tracks.push(...root.Audio2.recDest.stream.getAudioTracks());
    const m = mime(); rec = new MediaRecorder(new MediaStream(tracks), m ? { mimeType: m, videoBitsPerSecond: 16e6 } : {});
    chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => done(new Blob(chunks, { type: (m || 'video/webm').split(';')[0] }), m.includes('mp4') ? 'mp4' : 'webm');
    rec.start(250); t0 = performance.now();
    timer = setInterval(() => { const s = (performance.now() - t0) / 1000; $('#recTime').textContent = '● ' + Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }, 250);
    update(); return true;
  }
  function stopRec() { if (!rec) return; const r = rec; rec = null; clearInterval(timer); $('#recTime').textContent = ''; r.stop(); update(); }
  function done(blob, ext) {
    const url = URL.createObjectURL(blob), name = `nesting-dolls-demo-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.${ext}`;
    const out = $('#recOut'); out.innerHTML = '';
    const v = document.createElement('video'); v.src = url; v.controls = true; out.appendChild(v);
    const meta = document.createElement('p'); meta.className = 'hint'; meta.textContent = `${cv.width}×${cv.height} ${ext.toUpperCase()}, ${(blob.size / 1048576).toFixed(1)} MB`; out.appendChild(meta);
    if (downloads) {
      const b = document.createElement('button'); b.className = 'primary'; b.textContent = 'Save video';
      b.onclick = () => downloads.save({ filename: name, data: blob }).then(() => { meta.textContent += ' · saved'; }).catch(e => { meta.textContent += e && e.code === 'declined' ? ' · save cancelled' : ' · could not save'; });
      out.appendChild(b);
    } else { const a = document.createElement('a'); a.href = url; a.download = name; a.textContent = 'Download ' + name; out.appendChild(a); }
  }
  $('#rec').onclick = async () => {
    if (rec) { G.autoplay = false; stopRec(); return; }
    const mode = $('#recMode').value;
    if (mode === 'manual') { startRec(); return; }
    if (G.busy) return;
    if (!startRec()) return;
    await new Promise(r => setTimeout(r, 400));
    if (mode === 'spin') await root.Game.play(); else await root.Game.playQueue();
    await new Promise(r => setTimeout(r, 900));
    stopRec();
  };

  /* ---------- status ---------- */
  function update() {
    $('#playQueue').textContent = G.autoplay ? 'Stop after this spin' : 'Play list';
    $('#spin').disabled = G.busy;
    $('#rec').classList.toggle('on', !!rec); $('#rec').textContent = rec ? '■ Stop' : '● Record';
    renderQueue();
  }
  G.onChange = update;

  root.Game.boot().then(() => {
    ED_SYMS.forEach(id => { thumbs[id] = thumb(id); });
    renderPalette(); renderEditor(); update(); fit();
    const inf = G.assetInfo || { missing: [], loaded: 0 };
    $('#assetInfo').textContent = `${inf.loaded} of ${inf.loaded + inf.missing.length} image files found in assets/. The rest use built-in placeholders.`;
    $('#assetList').innerHTML = inf.missing.map(k => `<li>${k}: ${root.ASSET_MANIFEST.images[k]}</li>`).join('');
  });
  try { if (root.claude && root.claude.use) root.claude.use('downloads').then(d => { downloads = d; }).catch(() => {}); } catch (e) {}
})(window);

</script>
